name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estructura del proyecto Android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app/src/main/java/com/example/topobt
          grep -q "version '8.5.2' apply false" build.gradle || { echo "Falta la versión del plugin Android en el build.gradle raíz. No reemplaces ese archivo por app/build.gradle."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar APK debug
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TopoBT-apk
          path: app/build/outputs/apk/debug/app-debug.apk
